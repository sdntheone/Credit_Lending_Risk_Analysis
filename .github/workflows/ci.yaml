name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3


      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}


      - name: Build Backend Image
        run: |
          docker build \
          -f Dockerfile.fastapi \
          -t ${{ secrets.DOCKER_HUB_USERNAME }}/credit-lending-backend:latest .


      - name: Build Frontend Image
        run: |
          docker build \
          -f Dockerfile.streamlit \
          -t ${{ secrets.DOCKER_HUB_USERNAME }}/credit-lending-frontend:latest .


      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/credit-lending-backend:latest


      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/credit-lending-frontend:latest


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd /home/ubuntu/credit-lending-risk-analysis

            docker compose down

            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/credit-lending-backend:latest

            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/credit-lending-frontend:latest

            docker compose up -d